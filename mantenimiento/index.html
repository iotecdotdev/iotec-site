<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iotec — En mantenimiento</title>
<meta name="description" content="iotec.dev está temporalmente en mantenimiento.">
<!-- Sin indexar: es una pagina temporal, no queremos que sustituya al sitio en las busquedas. -->
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --fondo: #0d1117;
    --texto: #e6edf3;
    --suave: #8b949e;
    --borde: #21262d;
    --acento: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--fondo);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 34rem; width: 100%; text-align: center; }
  .marca {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 0.5rem;
  }
  .punto { color: var(--acento); }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 1.25rem; }
  p { margin: 0 0 1rem; color: var(--suave); }
  .en {
    margin-top: 1.75rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--borde);
    font-size: 0.95rem;
  }
  .contacto { margin-top: 1.75rem; font-size: 0.95rem; }
  a { color: var(--acento); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .sep { color: var(--borde); margin: 0 0.6rem; }
</style>
</head>
<body>
<main>
  <div class="marca">iotec<span class="punto">.dev</span></div>
  <h1>Estamos en mantenimiento</h1>
  <p>El sitio volverá pronto. Los servicios en funcionamiento no se ven afectados.</p>

  <div class="en">
    <h1>Under maintenance</h1>
    <p>The site will be back soon. Running services are not affected.</p>
  </div>

  <p class="contacto">
    <a href="mailto:soporte@iotec.dev">soporte@iotec.dev</a>
    <span class="sep">·</span>
    <a href="https://t.me/iotecdotdev" rel="noopener">Telegram</a>
  </p>
</main>
</body>
</html>
